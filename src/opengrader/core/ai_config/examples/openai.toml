# Example provider manifest: OpenAI's hosted API.
#
# This file is NOT loaded automatically — load_all() only reads the
# `providers/` directory beside ai.json, and this one lives in
# ai_config/examples/ instead (see the comment in manifests.py for why that
# split is load-bearing, not an oversight). To actually use this provider,
# copy it into your config directory as providers/openai.toml, or run:
#
#   opengrader-providers add --example openai
#
# Nothing here is secret. api_key_env only NAMES the environment variable
# Opengrader reads a key from at run time — never write the key itself into
# a manifest.

name         = "openai"
label        = "OpenAI"
summary      = "OpenAI's hosted GPT models, over the API key you already have."
dialect      = "openai-chat"
host         = "https://api.openai.com/v1"
vision_model = "gpt-4o-mini"
text_model   = "gpt-4o-mini"
api_key_env  = "OPENAI_API_KEY"
setup_hint   = "Create a key at https://platform.openai.com/api-keys, then set OPENAI_API_KEY."

# OpenAI can list the models a key is entitled to, so the pre-flight checks
# the model is actually available instead of just checking the key resolves.
supports_model_listing = true

# Approximate list pricing, per million tokens, as of this file being
# written. Feeds the L4 pre-flight cost estimate; it is a stated number, not
# a discovered one — OpenAI's API does not report its own price list — so
# check https://openai.com/api/pricing/ before trusting it for a real run.
[pricing]
input_per_mtok  = 0.15
output_per_mtok = 0.60
