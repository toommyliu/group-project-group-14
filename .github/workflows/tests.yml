name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      # The `opengrader` launchers are covered by tests/unit/packaging/, so a
      # change to one of them has to be able to trigger this workflow.
      - 'packaging/opengrader*'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'packaging/opengrader*'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 3 # maybe change when we have more complex tests
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # https://docs.astral.sh/uv/guides/integration/github/
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr libgl1 libglib2.0-0

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest
