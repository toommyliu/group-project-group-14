# Phase 0 gold file — human-verified transcriptions.
#
# THIS IS THE ONLY LEGITIMATE REFERENCE FOR SCORING. See README.md
# "The ground-truth trap" for why: the `Response text` already recorded in
# each samples/**/*.submission.md is the CURRENT OLLAMA PIPELINE'S OWN
# OUTPUT ("Read by: vision-model"). Scoring any backend, Ollama included,
# against that text would score Ollama against itself and manufacture a
# ~100% result with zero information content. run_spike.py enforces this:
# it reads gold_text ONLY from this file, and any crop with no non-empty
# gold_text here is excluded from CER — never silently scored against the
# submission markdown.
#
# HOW TO FILL THIS IN
#   1. Open the crop image named in the entry's key, e.g. for the key
#      "cs146-quiz1/submission-0001/q2" open
#      samples/cs146-quiz1/student-submissions/submission-0001/responses/q2.png
#   2. Read the handwritten answer yourself (a human, not a model output).
#      Transcribe literally, matching the shipped prompt's own convention:
#      write [unclear] for an illegible word or symbol, [mark] for a
#      handwritten non-text mark, and leave gold_text = "" if nothing is
#      legibly written at all (a legitimately blank/empty answer is a valid
#      gold value, and different from an unfilled stub only via verified_by).
#   3. Set gold_text, verified_by (your name or email), and verified_on
#      (ISO date, e.g. "2026-09-19").
#   4. An entry with gold_text = "" is treated as NOT YET FILLED IN and is
#      excluded from CER. This means a genuinely blank answer and an
#      unfilled stub currently look the same to the scorer — acceptable for
#      a Phase 0 spike (see README's "threats to validity"), but do not
#      generalize this file format past the spike without fixing that.
#
# Every crop run_spike.py discovers under samples/ gets a stub entry below,
# auto-generated by walking samples/**/*.submission.md — this file does not
# need to be hand-extended when a new sample is added, only hand-FILLED.
#
# ---------------------------------------------------------------------------
# WORKED EXAMPLE (format only — not a real crop, not scored)
#
# The key below does not match any crop run_spike.py will discover (no
# sample directory is named "example"), so it is inert: it demonstrates the
# schema without being mistaken for a real verified entry, and without this
# file asserting a "human verification" that did not actually happen. Copy
# this shape when filling in the real stubs below.
#
# [crops."example/submission-0000/q1"]
# gold_text = "5280 feet per mile"
# verified_by = "marco1408@duck.com"
# verified_on = "2026-09-19"
# ---------------------------------------------------------------------------

