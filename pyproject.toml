[project]
name = "opengrader"
version = "1.0"
description = "TUI application that will streamline and automate grading"
authors = [
  { name = "Andy Cortes", email = "andy.cortes@sjsu.edu" },
  { name = "Arjun Gill", email = "arjun.gill@sjsu.edu" },
  { name = "Tommy Liu", email = "tommy.liu@sjsu.edu" },
  { name = "Marco Lopez", email = "marco.lopez@sjsu.edu" }
]
requires-python = ">=3.10"
dependencies = [
  "textual>=8.1.1,<9.0.0",
  "typing-extensions>=4.4.0",
  "rich>=14.2.0",
  "update>=0.0.1,<0.0.2",
  "pypdf>=6.9.1,<7.0.0",
  "pymupdf>=1.25.3,<2.0.0",
  "argparse>=1.4.0,<2.0.0",
  "textual-image>=0.8.5,<0.9.0",
  "pillow>=12.1.1,<13.0.0",
  "pytesseract>=0.3.13",
  "opencv-python>=4.13.0.92",
  "pytest>=9.0.2",
  "platformdirs>=4.0.0,<5.0.0",
]

[project.scripts]
tui = "opengrader.tui.main:run_app"
tui-dev = "opengrader.tui.main:run_app_dev"
ocr-pdf = "opengrader.cli.ocr_pdf:run_cli"
qa-file = "opengrader.cli.qa_file:run_cli"
student-submission-file = "opengrader.cli.student_submission_file:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
