[project]
name = "opengrader"
version = "1.0"
description = "TUI application that will streamline and automate grading"
authors = [
  { name = "Andy Cortes", email = "andy.cortes@sjsu.edu" },
  { name = "Arjun Gill", email = "arjun.gill@sjsu.edu" },
  { name = "Tommy Liu", email = "tommy.liu@sjsu.edu" },
  { name = "Marco Lopez", email = "marco.lopez@sjsu.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "textual>=8.1.1,<9.0.0",
  "typing-extensions>=4.4.0",
  "rich>=14.2.0",
  "update>=0.0.1,<0.0.2",
  "pypdf>=6.9.1,<7.0.0",
  "pymupdf>=1.25.3,<2.0.0",
  "textual-image>=0.8.5,<0.9.0",
  "pillow>=12.1.1,<13.0.0",
  "pytesseract>=0.3.13",
  "opencv-python>=4.13.0.92",
  "pytest>=9.0.2",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "matplotlib>=3.10,<4.0",
  "canvas-sak>=1.0",
  "python-docx>=1.1.0,<2.0.0",
  "segno>=1.6.0,<2.0.0",
  "cryptography>=42.0,<47.0",
  "click>=8.1,<9.0",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "psutil>=6,<8",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
math = [
  "pix2tex>=0.1.2",
]

photos = [
  "pillow-heif>=0.18,<1.0",
]
pydantic-ai = [
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,mistral,openai]>=2,<3",
]

[project.scripts]
opengrader = "opengrader.cli.main:main"
tui = "opengrader.tui.main:tui_command"
opengrader-run = "opengrader.cli.run:command"
doctor = "opengrader.cli.doctor:command"
opengrader-providers = "opengrader.cli.providers:command"
opengrader-data-flow = "opengrader.cli.data_flow:command"
create-answer-key = "opengrader.cli.answer_key:command"
automated-grading = "opengrader.cli.automated_grading:command"
qa-file = "opengrader.cli.qa_file:command"
scan-check = "opengrader.cli.scan_check:command"
region-map = "opengrader.cli.region_map:command"
submission-splitter = "opengrader.cli.submission_splitter:command"
photo-import = "opengrader.cli.photo_import:command"
submission-extractor = "opengrader.cli.submission_extractor:command"
canvas-export = "opengrader.cli.canvas_export:command"
claim = "opengrader.cli.claim:command"
grades-export = "opengrader.cli.grades_export:command"
llm-eval = "opengrader.cli.llm_eval:command"
transcribe-eval = "opengrader.cli.transcribe_eval:command"
course-grades = "opengrader.cli.course_grades:command"
return-bundle = "opengrader.cli.return_bundle:command"
review-queue = "opengrader.cli.review_queue:command"
consistency-audit = "opengrader.cli.consistency_audit:command"
similarity-audit = "opengrader.cli.similarity_audit:command"
item-analysis = "opengrader.cli.item_analysis:command"
grade-check = "opengrader.cli.grade_check:command"
grade-release = "opengrader.cli.grade_release:command"
grade-history = "opengrader.cli.grade_history:command"
grade-restore = "opengrader.cli.grade_restore:command"
grade-merge = "opengrader.cli.grade_merge:command"
grade-backup = "opengrader.cli.grade_backup:command"
grading-stats = "opengrader.cli.grading_stats:command"
grading-policy = "opengrader.cli.grading_policy:command"
curve = "opengrader.cli.curve:command"
regrade = "opengrader.cli.regrade:command"
answer-groups = "opengrader.cli.answer_groups:command"
calibrate = "opengrader.cli.calibrate:command"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrader"]
artifacts = ["src/opengrader/web/dist/**"]

[tool.hatch.build.targets.wheel.force-include]
"assets/fonts/cmu/cmunrm.ttf" = "assets/fonts/cmu/cmunrm.ttf"
"assets/fonts/cmu/cmunbx.ttf" = "assets/fonts/cmu/cmunbx.ttf"
"THIRD_PARTY_LICENSES" = "THIRD_PARTY_LICENSES"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = [
    "ignore:builtin type [Ss]wig:DeprecationWarning",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pip-licenses>=5.0.0",
    "textual-dev>=1.8.0",
]
