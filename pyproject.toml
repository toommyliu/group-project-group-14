[project]
name = "opengrader"
version = "1.0"
description = "TUI application that will streamline and automate grading"
authors = [
  { name = "Andy Cortes", email = "andy.cortes@sjsu.edu" },
  { name = "Arjun Gill", email = "arjun.gill@sjsu.edu" },
  { name = "Tommy Liu", email = "tommy.liu@sjsu.edu" },
  { name = "Marco Lopez", email = "marco.lopez@sjsu.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "textual>=8.1.1,<9.0.0",
  "typing-extensions>=4.4.0",
  "rich>=14.2.0",
  "update>=0.0.1,<0.0.2",
  "pypdf>=6.9.1,<7.0.0",
  "pymupdf>=1.25.3,<2.0.0",
  "argparse>=1.4.0,<2.0.0",
  "textual-image>=0.8.5,<0.9.0",
  "pillow>=12.1.1,<13.0.0",
  "pytesseract>=0.3.13",
  "opencv-python>=4.13.0.92",
  "pytest>=9.0.2",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "matplotlib>=3.10,<4.0",
  "canvas-sak>=1.0",
  "python-docx>=1.1.0,<2.0.0",
  "segno>=1.6.0,<2.0.0",
  "cryptography>=42.0,<47.0",
  "click>=8.1,<9.0",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
math = [
  "pix2tex>=0.1.2",
]

photos = [
  "pillow-heif>=0.18,<1.0",
]

[project.scripts]
opengrader = "opengrader.cli.main:main"
tui = "opengrader.tui.main:run_app"
opengrader-run = "opengrader.cli.run:main"
tui-dev = "opengrader.tui.main:run_app_dev"
doctor = "opengrader.cli.doctor:main"
create-answer-key = "opengrader.cli.answer_key:run_cli"
automated-grading = "opengrader.cli.automated_grading:run_cli"
qa-file = "opengrader.cli.qa_file:run_cli"
scan-check = "opengrader.cli.scan_check:run_cli"
region-map = "opengrader.cli.region_map:run_cli"
submission-splitter = "opengrader.cli.submission_splitter:run_cli"
photo-import = "opengrader.cli.photo_import:run_cli"
submission-extractor = "opengrader.cli.submission_extractor:run_cli"
canvas-export = "opengrader.cli.canvas_export:run_cli"
claim = "opengrader.cli.claim:run_cli"
grades-export = "opengrader.cli.grades_export:run_cli"
llm-eval = "opengrader.cli.llm_eval:main"
transcribe-eval = "opengrader.cli.transcribe_eval:main"
course-grades = "opengrader.cli.course_grades:run_cli"
return-bundle = "opengrader.cli.return_bundle:run_cli"
review-queue = "opengrader.cli.review_queue:run_cli"
consistency-audit = "opengrader.cli.consistency_audit:run_cli"
similarity-audit = "opengrader.cli.similarity_audit:run_cli"
item-analysis = "opengrader.cli.item_analysis:run_cli"
grade-check = "opengrader.cli.grade_check:main"
grade-release = "opengrader.cli.grade_release:run_cli"
grade-history = "opengrader.cli.grade_history:run_cli"
grade-restore = "opengrader.cli.grade_restore:run_cli"
grade-merge = "opengrader.cli.grade_merge:run_cli"
grade-backup = "opengrader.cli.grade_backup:run_cli"
grading-stats = "opengrader.cli.grading_stats:run_cli"
grading-policy = "opengrader.cli.grading_policy:run_cli"
curve = "opengrader.cli.curve:run_cli"
regrade = "opengrader.cli.regrade:run_cli"
answer-groups = "opengrader.cli.answer_groups:run_cli"
calibrate = "opengrader.cli.calibrate:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrader"]

[tool.hatch.build.targets.wheel.force-include]
"assets/fonts/cmu/cmunrm.ttf" = "assets/fonts/cmu/cmunrm.ttf"
"assets/fonts/cmu/cmunbx.ttf" = "assets/fonts/cmu/cmunbx.ttf"
"THIRD_PARTY_LICENSES" = "THIRD_PARTY_LICENSES"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = [
    "ignore:builtin type [Ss]wig:DeprecationWarning",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip-licenses>=5.0.0",
    "textual-dev>=1.8.0",
]
