[project]
name = "opengrader"
version = "0.0.1"
description = "Grade paper assignments faster, right on your own computer"
readme = "README.md"
authors = [
  { name = "Andy Cortes" },
  { name = "Arjun Gill" },
  { name = "Tommy Liu" },
  { name = "Marco Lopez" }
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Education",
  "Topic :: Education",
]
dependencies = [
  "textual>=8.1.1,<9.0.0",
  "typing-extensions>=4.4.0",
  "rich>=14.2.0",
  "pypdf>=6.9.1,<7.0.0",
  "pymupdf>=1.25.3,<2.0.0",
  "textual-image>=0.14.2,<0.15.0",
  "pillow>=12.1.1,<13.0.0",
  "pytesseract>=0.3.13",
  "opencv-python>=4.13.0.92",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "matplotlib>=3.10,<4.0",
  "canvas-sak>=1.0",
  "python-docx>=1.1.0,<2.0.0",
  "segno>=1.6.0,<2.0.0",
  "cryptography>=42.0,<47.0",
  "click>=8.1,<9.0",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "psutil>=6,<8",
  "authlib>=1.3,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.22,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime>=1.22,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
math = [
  "pix2tex>=0.1.2",
]

photos = [
  "pillow-heif>=0.18,<1.0",
]
pydantic-ai = [
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,mistral,openai]>=2,<3",
]

[project.scripts]
opengrader = "opengrader.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrader"]
exclude = ["/src/opengrader/web/*"]
artifacts = ["/src/opengrader/web/dist/**"]

[tool.hatch.build.targets.sdist]
include = ["/src/opengrader", "/LICENSE", "/THIRD_PARTY_LICENSES", "/README.md"]
exclude = ["/src/opengrader/web/node_modules"]
artifacts = ["/src/opengrader/web/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = [
    "ignore:builtin type [Ss]wig:DeprecationWarning",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"
default = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
browser = [
    "pytest-playwright>=0.10.0",
]
dev = [
    "pip-licenses>=5.0.0",
    "pytest>=9.0.2",
    "textual-dev>=1.8.0",
]
