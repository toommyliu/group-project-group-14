[project]
name = "local-grader"
version = "1.0"
description = "TUI application that will streamline and automate grading"
authors = [
  { name = "Andy Cortes", email = "andy.cortes@sjsu.edu" },
  { name = "Arjun Gill", email = "arjun.gill@sjsu.edu" },
  { name = "Tommy Liu", email = "tommy.liu@sjsu.edu" },
  { name = "Marco Lopez", email = "marco.lopez@sjsu.edu" }
]
requires-python = ">=3.10"
dependencies = [
  "textual (>=8.1.1,<9.0.0)",
  "typing-extensions >=4.4.0",
  "rich >=14.2.0",
  "update (>=0.0.1,<0.0.2)",
  "pypdf (>=6.9.1,<7.0.0)",
  "pymupdf (>=1.25.3,<2.0.0)",
  "argparse (>=1.4.0,<2.0.0)",
  "textual-image (>=0.8.5,<0.9.0)",
  "pillow (>=12.1.1,<13.0.0)",
]

[tool.poetry]
version = "1.0"
packages = [
  { include = "local_grader", from = "src" }
]

[tool.poetry.scripts]
tui = "local_grader.tui.main:run_app"
pdf_splitter = "local_grader.cli.pdf_splitter:run_cli"
question_splitter = "local_grader.cli.question_splitter:run_cli"
roster_reader = "local_grader.cli.roster_reader:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/grading_tui_package"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
